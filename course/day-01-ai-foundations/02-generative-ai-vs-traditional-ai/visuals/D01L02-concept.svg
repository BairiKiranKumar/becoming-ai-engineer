<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">Generative AI vs Traditional AI</title><desc id="desc">Predictive tasks output labels, scores, or rankings; generative tasks compose content. Language generation itself uses repeated prediction.</desc><rect width="960" height="760" rx="24" fill="#10131A"/><g font-family="Arial,sans-serif" fill="#F3F6FC"><text x="48" y="62" font-size="29" font-weight="bold">D01L02 · Generative AI vs Traditional AI</text><rect x="48" y="110" width="864" height="100" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="72" y="150" font-size="25" font-weight="bold">SAME INPUT: support email</text><text x="72" y="183" font-size="21">“I was charged twice. Can you help?”</text><path d="M480 210 V245 H250 V290 M480 245 H710 V290" fill="none" stroke="#8EC5FF" stroke-width="3"/><text x="230" y="288" font-size="22">↓</text><text x="690" y="288" font-size="22">↓</text><rect x="48" y="300" width="410" height="110" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="72" y="340" font-size="25" font-weight="bold">Path A: classify</text><text x="72" y="373" font-size="21">Output: billing</text><rect x="502" y="300" width="410" height="110" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="526" y="340" font-size="25" font-weight="bold">Path B: generate</text><text x="526" y="373" font-size="21">Output: a draft reply</text><text x="520" y="465" font-size="23">↓ Check claims before use</text><text x="65" y="565" font-size="23">Two tasks applied to the same email.</text><text x="65" y="625" font-size="23">A generative model can also perform classification.</text><text x="65" y="670" font-size="23">Task comparison; not separate levels of intelligence.</text></g></svg>
