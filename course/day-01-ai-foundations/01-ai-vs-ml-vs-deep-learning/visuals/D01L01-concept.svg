<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">AI vs ML vs Deep Learning</title><desc id="desc">AI is the broad field; ML learns from data; DL is multilayer neural-network learning within ML.</desc><rect width="960" height="760" rx="24" fill="#10131A"/><g font-family="Arial,sans-serif" fill="#F3F6FC"><text x="48" y="62" font-size="29" font-weight="bold">D01L01 · AI vs ML vs Deep Learning</text><rect x="48" y="100" width="864" height="600" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="72" y="140" font-size="25" font-weight="bold">AI: the broad field</text><text x="72" y="173" font-size="21">Rules, reasoning, search, planning and learning</text><rect x="100" y="260" width="760" height="390" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="124" y="300" font-size="25" font-weight="bold">Machine learning</text><text x="124" y="333" font-size="21">Example: fitted logistic-regression spam classifier</text><rect x="150" y="420" width="660" height="180" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="174" y="460" font-size="25" font-weight="bold">Deep learning</text><text x="174" y="493" font-size="21">Example: deep neural image classifier</text><text x="80" y="225" font-size="22">Rule-based expert system: AI without ML</text></g></svg>
