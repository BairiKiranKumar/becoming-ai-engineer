<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">What Does an AI Engineer Actually Build?</title><desc id="desc">AI engineers build and maintain useful systems connecting models, data, software, evaluation, permissions, and monitoring.</desc><rect width="960" height="760" rx="24" fill="#10131A"/><g font-family="Arial,sans-serif" fill="#F3F6FC"><text x="48" y="62" font-size="29" font-weight="bold">D01L03 · What Does an AI Engineer Actually Build?</text><rect x="48" y="105" width="864" height="95" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="72" y="145" font-size="25" font-weight="bold">1. Question + identity → authorization</text><text x="72" y="178" font-size="21">Enforce permissions before retrieving evidence</text><rect x="48" y="235" width="864" height="95" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="72" y="275" font-size="25" font-weight="bold">2. Retrieve permitted, current evidence</text><text x="72" y="308" font-size="21">Missing evidence → escalate; do not invent</text><rect x="48" y="365" width="864" height="95" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="72" y="405" font-size="25" font-weight="bold">3. Model drafts → check claims and sources</text><text x="72" y="438" font-size="21">Unsupported claims → escalate; supported → respond</text><rect x="48" y="495" width="864" height="95" rx="15" fill="#1D2B3B" stroke="#8EC5FF" stroke-width="2"/><text x="72" y="535" font-size="25" font-weight="bold">4. Application controls actions</text><text x="72" y="568" font-size="21">Refunds require a separate authorized process</text><text x="65" y="226" font-size="23">↓</text><text x="65" y="356" font-size="23">↓</text><text x="65" y="486" font-size="23">↓</text><text x="65" y="650" font-size="23">Monitor quality, failures, latency and cost → improve tests.</text><text x="65" y="691" font-size="21">Schematic workflow, not an implemented service.</text></g></svg>
